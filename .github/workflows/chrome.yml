name: Chrome extension

# Tests and zips the Sales Xray Chrome extension (apps/chrome) on GitHub-hosted
# Linux runners. Every run keeps the zip as a 14-day artifact. The extension
# holds no keys or tokens. Publishing is a separate, deliberate step: run this
# workflow by hand on main with "publish" ticked, which replaces the files of
# the "sales-xray-chrome-latest" release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the sales-xray-chrome-latest release (main only)
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - apps/chrome/**
      - .github/workflows/chrome.yml

permissions:
  contents: read

# A publish run is never cancelled, so a release update can't stop half way.
concurrency:
  group: chrome-${{ github.ref }}-${{ inputs.publish && 'publish' || 'build' }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/chrome
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test
        run: node --test test/*.test.js
      - name: Stamp the version
        run: node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json", "utf8")); m.version = "0.2.${{ github.run_number }}"; fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2));'
      - name: Zip
        run: |
          mkdir -p dist
          zip -r -X "dist/sales-xray-chrome-0.2.${{ github.run_number }}.zip" \
            manifest.json worker.js lead-link.js popup.html popup.js popup.css whatsapp.js icons
          sha256sum dist/*.zip
      - name: Keep the zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-chrome-${{ github.run_number }}
          path: apps/chrome/dist/*.zip
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: zip
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sales-xray-chrome-${{ github.run_number }}
          path: dist
      - name: Update the published release in place
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sales-xray-chrome-latest
          VERSION: 0.2.${{ github.run_number }}
        run: |
          cp "sales-xray-chrome-$VERSION.zip" sales-xray-chrome.zip
          sha256sum sales-xray-chrome.zip > SHA256SUMS.txt
          title="Sales Xray for Chrome $VERSION"
          notes="Built from $GITHUB_SHA. Unzip, open chrome://extensions, switch on Developer mode, then Load unpacked and pick the folder."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Replace the files in place so the download link never breaks, then move the tag to this build.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber sales-xray-chrome.zip SHA256SUMS.txt
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "$title" --notes "$notes" sales-xray-chrome.zip SHA256SUMS.txt
          fi
