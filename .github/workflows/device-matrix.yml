name: Device matrix

# Sales Xray on every kind of device (owner order, 19 Oct), separate from the merge
# gate: production's public pages in Chromium, Firefox and WebKit, Chrome and Edge on
# Windows, Safari on macOS and iOS Simulator (old, small and large iPhones), the
# Android app on emulators of several Android versions and screens, and the call
# recorder's emulator proof. Screenshots are kept as artifacts. Nightly at 02:00 IST,
# on every Android release, and by hand. Signed-in flows wait for an approved test
# account (tests/device-matrix/README.md).

on:
  schedule:
    - cron: "30 20 * * *"
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-matrix
  cancel-in-progress: false

jobs:
  browsers-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Playwright and ${{ matrix.browser }}
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Public pages on five screens
        env:
          BROWSER: ${{ matrix.browser }}
          OUT: shots
        run: node tests/device-matrix/smoke.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-linux-${{ matrix.browser }}
          path: shots
          retention-days: 14

  browsers-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Playwright (the runner's own ${{ matrix.browser }})
        run: npm i --no-save --no-audit --no-fund playwright@1.49.1
      - name: Public pages on five screens
        env:
          BROWSER: ${{ matrix.browser }}
          OUT: shots
        run: node tests/device-matrix/smoke.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-windows-${{ matrix.browser }}
          path: shots
          retention-days: 14

  safari-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Safari's WebDriver
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 &
          sleep 3
      - name: Public pages in Safari
        env:
          OUT: shots
        run: node tests/device-matrix/safari.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-macos-safari
          path: shots
          retention-days: 14

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Safari on iPhone SE, 13 mini, 15 and 16 Pro Max
        env:
          OUT: shots
        run: bash tests/device-matrix/ios-simulator.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-ios-simulator
          path: shots
          retention-days: 14

  android-emulators:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Old and small; current with punch-hole, notch and big fonts; newest (always
          # edge-to-edge) with dark mode and both navigation styles; a tablet.
          - { api: 29, device: small_phone, variants: "font-large,buttons" }
          - { api: 33, device: pixel_6, variants: "punch-hole,notch,font-large" }
          - { api: 35, device: pixel_7, variants: "punch-hole,dark,gesture,buttons" }
          - { api: 35, device: pixel_tablet, variants: "dark" }
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app on Android ${{ matrix.api }}, ${{ matrix.device }}
        env:
          OUT: shots
        run: bash tests/device-matrix/android-emulator.sh ${{ matrix.api }} ${{ matrix.device }} "${{ matrix.variants }}"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-android-${{ matrix.api }}-${{ matrix.device }}
          path: shots
          retention-days: 14

  call-recorder:
    # The emulator proof lives in android.yml (it needs that run's test APKs).
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start the call-recorder proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref main -f emulator=true
