name: Mac and Windows

# Builds Sales Xray for Windows (.exe installer and .msi) and Mac (universal
# .dmg) with Tauri 2 (apps/desktop) on GitHub-hosted runners. Manual only: the
# builds are unsigned until the store launch (owner decisions D2 and D3), and
# Mac minutes would count 10x if this repo ever turned private. Each run builds
# "Sales Xray" (live site) and "Sales Xray Dev" (dev site, installs beside it),
# starts the live app on the runner as a smoke check, and keeps the installers
# and a screenshot as a 14-day artifact. Nothing is published from here.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which computers to build for
        type: choice
        options:
          - windows
          - macos
          - both
        default: windows

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-26' || 'windows-2025' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      VERSION: 0.1.${{ github.run_number }}
      BUNDLE_ARGS: ${{ matrix.platform == 'macos' && '--bundles app,dmg --target universal-apple-darwin' || '--bundles nsis,msi' }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Use the runner's Rust
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
          rustc --version
          cargo --version
      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Sales Xray
        run: npx tauri build --ci $BUNDLE_ARGS --config "{\"version\":\"$VERSION\"}"
      - name: Keep Sales Xray
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/release/bundle/*' \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec mv {} dist/ \;
          ls -l dist
      - name: Start it on Windows (smoke check)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath src-tauri/target/release/sales-xray-desktop.exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "Sales Xray exited with code $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/dist/windows-screen.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $app.Id -Force
      - name: Start it on the Mac (smoke check)
        if: matrix.platform == 'macos'
        run: |
          app=$(find src-tauri/target -path '*/release/bundle/macos/Sales Xray.app' -print -quit)
          test -n "$app"
          binary=$(find "$app/Contents/MacOS" -type f -perm -u+x -print -quit)
          "$binary" > dist/macos-app.log 2>&1 &
          pid=$!
          sleep 20
          kill -0 "$pid"
          screencapture -x dist/macos-screen.png
          kill "$pid"
      - name: Build Sales Xray Dev
        run: npx tauri build --ci $BUNDLE_ARGS --config src-tauri/tauri.dev.conf.json --config "{\"version\":\"$VERSION\"}"
      - name: Keep Sales Xray Dev
        run: |
          find src-tauri/target -path '*/release/bundle/*' \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec mv {} dist/ \;
          ls -l dist
          if command -v sha256sum > /dev/null; then sha256sum dist/*.exe dist/*.msi dist/*.dmg 2> /dev/null || true; else shasum -a 256 dist/*.dmg; fi
      - name: Keep the installers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-desktop-${{ matrix.platform }}-${{ github.run_number }}
          path: apps/desktop/dist/
          retention-days: 14
          if-no-files-found: error
