name: Live dev app

# "Sales X-Ray Live": a developer-only Android shell for the live phone design loop
# (owner, 13 Nov 2026). It opens http://localhost:3016, the local hot-reload
# dev server, reached from the phone through `adb reverse tcp:3016 tcp:3016` (USB or
# wireless debugging). Every saved UI change shows at once inside the real installed
# app shell: the same WebView, system bars and insets as the store app, not Chrome.
# Debug build, runner's throwaway key, 14-day artifact, never published. App id
# com.authorityclosers.salesxray.live, so it installs beside Sales X-Ray and Dev.
on:
  workflow_dispatch:
  push:
    branches: ["live-dev/**"]
    paths: [apps/phone/**, .github/workflows/live-dev.yml]
permissions:
  contents: read
concurrency:
  group: live-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Install Capacitor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Point the shell at the local dev server (cleartext to the phone's own localhost only)
        run: |
          node -e 'const fs = require("fs"); const file = "capacitor.config.json"; const c = JSON.parse(fs.readFileSync(file, "utf8")); c.server.url = "http://localhost:3016"; c.server.cleartext = true; c.android = Object.assign({}, c.android, { allowMixedContent: true, webContentsDebuggingEnabled: true }); delete c.server.errorPath; fs.writeFileSync(file, JSON.stringify(c, null, 2));'
          cat capacitor.config.json
          npx cap sync android
      - name: Allow cleartext in this build only
        run: sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
      - name: Build Sales X-Ray Live (debug)
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDirectDebug -PsxLive
      - name: Keep it
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/direct/debug/app-direct-debug.apk "dist/sales-xray-live-android-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-live-apk
          path: apps/phone/dist/*.apk
          retention-days: 14
