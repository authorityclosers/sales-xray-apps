name: Test Lab

# Firebase Test Lab on the free Spark quota (owner, 28 Oct 2026: "Are we using Firebase free testing and so on to 100x
# testing?"; free plan only for two weeks). After each green Android build on main, Robo explores the Play flavour (the
# live site, signed out: no sign-in account for robots yet) on Google's own phones: a physical budget phone and virtual
# phones on the oldest and the newest Android in range, chosen from Test Lab's catalogue (scripts/testlab.py).
#
# Nothing runs until the owner sets it up (tests/testlab/README.md): a separate Firebase project on Spark, two APIs, a
# service account this repository may act as through the same keyless GitHub federation as play.yml, and the
# repository variables SX_TESTLAB_PROJECT and SX_TESTLAB_SERVICE_ACCOUNT. Until then each run says so and passes.
#
# Spark allows 10 virtual and 5 physical test runs a day and can't be billed. A run takes 1 physical and 2 virtual
# devices, and at most 3 runs go ahead a day (counted from 00:00 UTC), which leaves room for a manual run.
on:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      android_run:
        description: The Android run whose test APKs to use (empty: the latest green run on main)
        type: string
        default: ""

permissions:
  contents: read

# One at a time, so the daily count is never raced.
concurrency:
  group: testlab
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      go: ${{ steps.budget.outputs.go }}
      run: ${{ steps.build.outputs.run }}
      number: ${{ steps.build.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: ${{ vars.SX_TESTLAB_PROJECT }}
      SERVICE_ACCOUNT: ${{ vars.SX_TESTLAB_SERVICE_ACCOUNT }}
      PER_DAY: "3"
    steps:
      - name: Set up yet?
        id: ready
        run: |
          if [ -z "$PROJECT" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Firebase Test Lab is not set up yet (no SX_TESTLAB_PROJECT or SX_TESTLAB_SERVICE_ACCOUNT): nothing ran. The owner's steps: tests/testlab/README.md." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Which build
        id: build
        if: steps.ready.outputs.ready == 'true'
        env:
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          ASKED: ${{ inputs.android_run }}
        run: |
          run=${EVENT_RUN:-$ASKED}
          if [ -z "$run" ]; then
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          number=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json number --jq .number)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Android run $run (#$number)" >> "$GITHUB_STEP_SUMMARY"
      - name: Today's free quota
        id: budget
        if: steps.ready.outputs.ready == 'true'
        run: |
          today=$(date -u +%F)
          used=0
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow testlab.yml --created ">=$today" --limit 50 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            n=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "Robo on Test Lab" and (.conclusion == "success" or .conclusion == "failure" or .status == "in_progress"))] | length')
            used=$((used + n))
          done
          if [ "$used" -ge "$PER_DAY" ]; then
            echo "Test Lab already ran $used times today (UTC); the free quota is kept for tomorrow. Nothing ran." >> "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Test Lab run $((used + 1)) of $PER_DAY today." >> "$GITHUB_STEP_SUMMARY"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  robo:
    name: Robo on Test Lab
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: ${{ vars.SX_TESTLAB_PROJECT }}
      TESTLAB_SERVICE_ACCOUNT: ${{ vars.SX_TESTLAB_SERVICE_ACCOUNT }}
      TESTLAB_WIF_PROVIDER: projects/501399142248/locations/global/workloadIdentityPools/github/providers/sales-xray-apps
      RUN: ${{ needs.plan.outputs.run }}
      NUMBER: ${{ needs.plan.outputs.number }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Get the Play flavour's test APK
        run: |
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "sales-xray-android-$NUMBER-test" -D apks
          apk=$(ls apks/sales-xray-android-play-*-test.apk | head -1)
          test -n "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "App: $(basename "$apk") (the Play flavour: the live site, signed out)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign in to Google without a key (GitHub OIDC, Workload Identity Federation)
        run: |
          creds="$RUNNER_TEMP/testlab-credentials.json"
          python3 scripts/testlab.py credentials "$creds"
          gcloud auth login --cred-file="$creds" --quiet
          gcloud config set project "$PROJECT" --quiet
      - name: Choose today's devices
        run: |
          gcloud firebase test android models list --format=json > "$RUNNER_TEMP/models.json"
          python3 scripts/testlab.py devices "$RUNNER_TEMP/models.json" > "$RUNNER_TEMP/devices.txt"
          { echo "Devices:"; sed 's/^/- /' "$RUNNER_TEMP/devices.txt"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Robo, signed out
        run: |
          args=()
          while read -r device; do args+=(--device "$device"); done < "$RUNNER_TEMP/devices.txt"
          set +e
          gcloud firebase test android run --type robo --app "$APK" "${args[@]}" \
            --timeout 300s --results-history-name "Sales Xray (Play flavour, signed out)" \
            --client-details "matrixLabel=Android run $NUMBER" 2>&1 | tee "$RUNNER_TEMP/robo.log"
          code=${PIPESTATUS[0]}
          set -e
          {
            echo
            grep -E '^\| ' "$RUNNER_TEMP/robo.log" || true
            grep -oE 'https://console\.firebase\.google\.com/\S+' "$RUNNER_TEMP/robo.log" | head -1 | sed 's/^/Results: /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          # 0: every device passed; 10: a device found a crash or failure (a real finding); anything else: Test Lab
          # could not run it (quota, an unavailable device).
          case "$code" in
            0) ;;
            10) echo "Robo found a crash or failure on at least one device (the table above)." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "Test Lab could not complete the run (gcloud exit $code)." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit "$code"
      - name: Forget the sign-in
        if: always()
        run: |
          gcloud auth revoke --all --quiet 2>/dev/null || true
          rm -f "$RUNNER_TEMP/testlab-credentials.json"
