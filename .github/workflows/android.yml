name: Android

# Builds the Sales Xray Android app (apps/phone) on GitHub-hosted Linux
# runners. "Sales Xray" opens the live site.
#
# Pushes and plain manual runs make test builds: debug APKs signed with the
# runner's throwaway key, kept as a 14-day CI artifact, never published. They
# include a "Sales Xray Dev" test APK that opens dev, and check that the
# release build compiles.
#
# Publishing is a separate, deliberate step: run this workflow by hand on main
# with "publish" ticked. Only that run reads the durable key, from the
# protected "android-release" environment (the owner approves each run; its
# secrets are set from the owner's laptop only). It builds the live app only
# (owner, 17 Oct: no Dev app for download), as a release APK that is not
# debuggable, and puts it on the "sales-xray-android-latest" release that
# Sales Xray's Phone app dialog links to.
on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: Platform repo ref whose web app goes inside the app (S9); production's commit for a release
        type: string
        default: main
      publish:
        description: Build with the durable key and update the sales-xray-android-latest release (main only, owner approves)
        type: boolean
        default: false
      signed_only:
        description: Build with the durable key and keep the APK as this run's artifact for QA; the published release stays as it is (main only, owner approves)
        type: boolean
        default: false
      emulator:
        description: Also prove the call recorder on an emulator (adb emu gsm call, accept, cancel)
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/phone/**
      - .github/workflows/android.yml
  push:
    branches:
      - main
    paths:
      - apps/phone/**
      - "!apps/phone/ios/**"
      - .github/workflows/android.yml

permissions:
  contents: read

# A publish run is never cancelled, so a release update can't stop half way.
concurrency:
  # Signed runs (publish, or signed_only for QA) are never cancelled by a later push.
  group: android-${{ github.ref }}-${{ (inputs.publish || inputs.signed_only) && 'publish' || 'build' }}
  cancel-in-progress: ${{ !(inputs.publish || inputs.signed_only) }}

jobs:
  # The accessibility call recorder on a real emulator with a real (emulated) SIM call:
  # ring, answer, hang up, then the device test checks the one tagged recording.
  emulator-call-recorder:
    if: ${{ inputs.emulator && !inputs.publish }}
    needs: test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Get the test APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sales-xray-android-${{ github.run_number }}-test
          path: dist
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ring, answer and hang up on an emulator; check the recording
        run: bash scripts/emulator-call-recorder.sh ${{ github.run_number }}

  test-build:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Install Capacitor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check out the web app (platform repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: authorityclosers/authority-closers-platform
          ref: ${{ inputs.web_ref || 'main' }}
          path: platform
          persist-credentials: false
      - name: The web app inside the app (its static export, served from the phone; S9)
        run: bash scripts/build-web-shell.sh "$GITHUB_WORKSPACE/platform" android/app/src/main/assets/web salesxray.authorityclosers.com
      - name: Sync the web shell into Android (live site)
        run: npx cap sync android
      - name: Unit tests
        working-directory: apps/phone/android
        run: ./gradlew --no-daemon --stacktrace testDirectDebugUnitTest testPlayDebugUnitTest
      - name: Build Sales Xray (test, both flavours)
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDirectDebug assemblePlayDebug
      - name: Check the release build compiles (unsigned, not kept)
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDirectRelease
      - name: The release build carries Crashlytics' build stamp (S6; without it crash reports stop at start-up)
        working-directory: apps/phone/android
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          apk=$(find app/build/outputs/apk/direct/release -name '*.apk' | head -1)
          "$aapt2" dump resources "$apk" | grep -E 'crashlytics\.(mapping_file_id|android\.build_id)' || { echo "No Crashlytics build stamp in $apk"; exit 1; }
      - name: Keep Sales Xray
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/direct/debug/app-direct-debug.apk "dist/sales-xray-android-0.3.${{ github.run_number }}-test.apk"
          # The Play flavour as an installable test APK (same app id; the Play Store gets the bundle).
          cp android/app/build/outputs/apk/play/debug/app-play-debug.apk "dist/sales-xray-android-play-0.3.${{ github.run_number }}-test.apk"
      - name: Point the shell at dev
        run: |
          node -e 'const fs = require("fs"); const file = "capacitor.config.json"; const config = JSON.parse(fs.readFileSync(file, "utf8")); config.server.url = "https://salesxray-dev.authorityclosers.com"; fs.writeFileSync(file, JSON.stringify(config, null, 2));'
          npx cap sync android
      - name: Build Sales Xray Dev (test)
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDirectDebug -PsxDev
      - name: The Play flavour carries no call history, direct calling, call recorder, all-files access or battery request
        working-directory: apps/phone/android
        run: |
          ./gradlew --no-daemon --stacktrace :app:processPlayDebugManifest :app:processDirectDebugManifest
          play=$(find app/build/intermediates -path '*merged_manifest*playDebug*' -name AndroidManifest.xml | head -1)
          direct=$(find app/build/intermediates -path '*merged_manifest*directDebug*' -name AndroidManifest.xml | head -1)
          # Only declarations count: the source manifests' comments name them too.
          for banned in android.permission.READ_CALL_LOG android.permission.CALL_PHONE com.authorityclosers.salesxray.CallRecorderService android.permission.MANAGE_EXTERNAL_STORAGE android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS; do
            if grep -q "android:name=\"$banned\"" "$play"; then echo "Play flavour still declares $banned ($play)"; exit 1; fi
            grep -q "android:name=\"$banned\"" "$direct" || { echo "Direct flavour lost $banned ($direct)"; exit 1; }
          done
          # Backup off in the Play build (cloud backup would copy in-app meeting recordings to Google Drive).
          grep -q 'android:allowBackup="false"' "$play" || { echo "Play flavour still allows backup"; exit 1; }
          # No microphone in the first Play version (owner, 24 Oct 2026); the download-link app keeps the
          # recorder, and the page's microphone needs both permissions there (BridgeWebChromeClient).
          for banned in android.permission.RECORD_AUDIO android.permission.FOREGROUND_SERVICE_MICROPHONE com.authorityclosers.salesxray.AppRecorder; do
            if grep -q "android:name=\"$banned\"" "$play"; then echo "Play flavour still declares $banned"; exit 1; fi
          done
          if grep -q 'foregroundServiceType="microphone"' "$play"; then echo "Play flavour still has a microphone foreground service"; exit 1; fi
          if grep -q 'android:name="android.permission.FOREGROUND_SERVICE"' "$play"; then echo "Play flavour still declares FOREGROUND_SERVICE"; exit 1; fi
          # No Privacy Sandbox ad permissions in either build (Play Console: "No advertising ID").
          for manifest in "$play" "$direct"; do
            if grep -q 'android:name="android.permission.ACCESS_ADSERVICES_' "$manifest"; then echo "AdServices permission declared in $manifest"; exit 1; fi
          done
          for needed in android.permission.RECORD_AUDIO android.permission.MODIFY_AUDIO_SETTINGS com.authorityclosers.salesxray.AppRecorder; do
            grep -q "android:name=\"$needed\"" "$direct" || { echo "Direct flavour lacks $needed"; exit 1; }
          done
          # No advertising ID in either build (declared to Play as "No advertising ID").
          for manifest in "$play" "$direct"; do
            if grep -q 'android:name="com.google.android.gms.permission.AD_ID"' "$manifest"; then echo "AD_ID declared in $manifest"; exit 1; fi
          done
          echo "Play flavour: none of them ($play); direct keeps all ($direct)"
      - name: The Play App Bundle builds (unsigned)
        working-directory: apps/phone/android
        run: |
          ./gradlew --no-daemon --stacktrace bundlePlayRelease
          echo "bundle: $(stat -c %s app/build/outputs/bundle/playRelease/app-play-release.aab) bytes (the upload takes up to 10 MB)"
      - name: Build the on-phone tests for Sales Xray Dev
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDirectDebugAndroidTest -PsxDev
      - name: Keep Sales Xray Dev
        run: |
          cp android/app/build/outputs/apk/direct/debug/app-direct-debug.apk "dist/sales-xray-dev-android-0.3.${{ github.run_number }}-test.apk"
          # Run on a connected phone with adb (DeviceCaptureTest.java says how).
          cp android/app/build/outputs/apk/androidTest/direct/debug/app-direct-debug-androidTest.apk "dist/sales-xray-dev-android-0.3.${{ github.run_number }}-device-tests.apk"
          sha256sum dist/*.apk
      - name: Keep the test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-android-${{ github.run_number }}-test
          path: apps/phone/dist/*.apk
          retention-days: 14
          if-no-files-found: error

  refuse-publish-off-main:
    if: ${{ (inputs.publish || inputs.signed_only) && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Publish runs only on main
        run: |
          echo "::error::Publish runs only on main. Nothing was built or published."
          exit 1

  signed-build:
    if: ${{ (inputs.publish || inputs.signed_only) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-release
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Install Capacitor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load the durable signing key
        env:
          STORE_BASE64: ${{ secrets.SX_ANDROID_SIGNING_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SX_ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$STORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::The durable signing key isn't set on the android-release environment. Nothing was built or published."
            exit 1
          fi
          printf '%s' "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/sales-xray.keystore"
          echo "SX_SIGNING_STORE=$RUNNER_TEMP/sales-xray.keystore" >> "$GITHUB_ENV"
      - name: Check out the web app (platform repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: authorityclosers/authority-closers-platform
          ref: ${{ inputs.web_ref || 'main' }}
          path: platform
          persist-credentials: false
      - name: The web app inside the app (its static export, served from the phone; S9)
        run: bash scripts/build-web-shell.sh "$GITHUB_WORKSPACE/platform" android/app/src/main/assets/web salesxray.authorityclosers.com
      - name: Sync the web shell into Android (live site)
        run: npx cap sync android
      - name: Build Sales Xray
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
          SX_SIGNING_PASSWORD: ${{ secrets.SX_ANDROID_SIGNING_PASSWORD }}
          # A QA run also signs the Play build as an APK, to install over the download-link app.
          SX_ALSO: ${{ inputs.signed_only && !inputs.publish && 'assemblePlayRelease' || '' }}
        run: ./gradlew --no-daemon --stacktrace assembleDirectRelease $SX_ALSO
      - name: Keep Sales Xray
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk "dist/sales-xray-android-0.3.${{ github.run_number }}.apk"
          if [ -f android/app/build/outputs/apk/play/release/app-play-release.apk ]; then
            cp android/app/build/outputs/apk/play/release/app-play-release.apk "dist/sales-xray-android-play-0.3.${{ github.run_number }}.apk"
          fi
      # QA only, never published: Sales X-Ray Dev signed with the same durable key, so Google's
      # and Facebook's in-app sign-in (NativeSignIn) know its signature. Test builds use a new
      # throwaway key on every run, which no sign-in console can be told about.
      - name: Build Sales X-Ray Dev with the durable key (QA run only)
        if: ${{ inputs.signed_only && !inputs.publish }}
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
          SX_SIGNING_PASSWORD: ${{ secrets.SX_ANDROID_SIGNING_PASSWORD }}
        run: |
          node -e 'const fs = require("fs"); const file = "capacitor.config.json"; const config = JSON.parse(fs.readFileSync(file, "utf8")); config.server.url = "https://salesxray-dev.authorityclosers.com"; fs.writeFileSync(file, JSON.stringify(config, null, 2));'
          npx cap sync android
          (cd android && ./gradlew --no-daemon --stacktrace assembleDirectRelease -PsxDev)
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk "dist/sales-xray-dev-android-0.3.${{ github.run_number }}.apk"
      - name: Drop the key
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/sales-xray.keystore"
          sha256sum dist/*.apk || true
      - name: Keep the signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-android-${{ github.run_number }}
          path: apps/phone/dist/*.apk
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: signed-build
    # A signed_only run (QA before a release) stops at the kept APK.
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sales-xray-android-${{ github.run_number }}
          path: dist
      - name: Update the published release in place
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sales-xray-android-latest
          VERSION: 0.3.${{ github.run_number }}
        run: |
          cp "sales-xray-android-$VERSION.apk" sales-xray-android.apk
          sha256sum sales-xray-android.apk > SHA256SUMS.txt
          title="Sales Xray for Android $VERSION"
          notes="Built from $GITHUB_SHA and signed with Authority Closers' key. Install help: https://salesxray.authorityclosers.com/apps"
          # A normal release marked latest (owner, 18 Oct): /releases/latest/download/sales-xray-android.apk
          # and the /apps page read it, so a publish must never turn it back into a pre-release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Replace the files in place so the download links never break, then move the tag to this build.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber sales-xray-android.apk SHA256SUMS.txt
            # GitHub refuses the workflow's token a tag move onto a commit that changes workflow
            # files (19 Oct, run 39223196327): the notes name the build either way, so go on.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null     || echo "::warning::The tag stays where it was (this build changes workflow files); the release notes name $GITHUB_SHA."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title "$title" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "$title" --notes "$notes" sales-xray-android.apk SHA256SUMS.txt
          fi
