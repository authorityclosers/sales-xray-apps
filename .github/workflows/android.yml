name: Android

# Builds the Sales Xray Android app (apps/phone) on GitHub-hosted Linux
# runners. "Sales Xray" opens the live site.
#
# Pushes and plain manual runs make test builds: debug APKs signed with the
# runner's throwaway key, kept as a 14-day CI artifact, never published. They
# include a "Sales Xray Dev" test APK that opens dev, and check that the
# release build compiles.
#
# Publishing is a separate, deliberate step: run this workflow by hand on main
# with "publish" ticked. Only that run reads the durable key, from the
# protected "android-release" environment (the owner approves each run; its
# secrets are set from the owner's laptop only). It builds the live app only
# (owner, 17 Oct: no Dev app for download), as a release APK that is not
# debuggable, and puts it on the "sales-xray-android-latest" release that
# Sales Xray's Phone app dialog links to.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Build with the durable key and update the sales-xray-android-latest release (main only, owner approves)
        type: boolean
        default: false
      emulator:
        description: Also prove the call recorder on an emulator (adb emu gsm call, accept, cancel)
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - apps/phone/**
      - "!apps/phone/ios/**"
      - .github/workflows/android.yml

permissions:
  contents: read

# A publish run is never cancelled, so a release update can't stop half way.
concurrency:
  group: android-${{ github.ref }}-${{ inputs.publish && 'publish' || 'build' }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  # The accessibility call recorder on a real emulator with a real (emulated) SIM call:
  # ring, answer, hang up, then the device test checks the one tagged recording.
  emulator-call-recorder:
    if: ${{ inputs.emulator && !inputs.publish }}
    needs: test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the test APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sales-xray-android-${{ github.run_number }}-test
          path: dist
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ring, answer and hang up; check the recording
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            P=com.authorityclosers.salesxray.dev; adb install dist/sales-xray-dev-android-0.3.${{ github.run_number }}-test.apk; adb install dist/sales-xray-dev-android-0.3.${{ github.run_number }}-device-tests.apk
            for perm in RECORD_AUDIO READ_PHONE_STATE READ_MEDIA_AUDIO POST_NOTIFICATIONS; do adb shell pm grant $P android.permission.$perm; done
            adb shell settings put secure enabled_accessibility_services $P/com.authorityclosers.salesxray.CallRecorderService; adb shell settings put secure accessibility_enabled 1; sleep 8
            adb shell am broadcast -n $P/com.authorityclosers.salesxray.SimulateCallReceiver -e state want-on
            adb emu gsm call 5551234; sleep 4; adb emu gsm accept 5551234; sleep 10; adb emu gsm cancel 5551234; sleep 6
            adb shell am instrument -w -e class com.authorityclosers.salesxray.DeviceCaptureTest#aCallWasRecordedByTheRecorder -e expectCall phone $P.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt; adb logcat -d -s SXTEST:I | tail -20; grep -q "^OK (1 test)" instrument.txt

  test-build:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Install Capacitor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sync the web shell into Android (live site)
        run: npx cap sync android
      - name: Unit tests
        working-directory: apps/phone/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Build Sales Xray (test)
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Check the release build compiles (unsigned, not kept)
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Keep Sales Xray
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/sales-xray-android-0.3.${{ github.run_number }}-test.apk"
      - name: Point the shell at dev
        run: |
          node -e 'const fs = require("fs"); const file = "capacitor.config.json"; const config = JSON.parse(fs.readFileSync(file, "utf8")); config.server.url = "https://salesxray-dev.authorityclosers.com"; fs.writeFileSync(file, JSON.stringify(config, null, 2));'
          npx cap sync android
      - name: Build Sales Xray Dev (test)
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug -PsxDev
      - name: A Play Store build carries no call recorder
        working-directory: apps/phone/android
        run: |
          ./gradlew --no-daemon --stacktrace :app:processDebugManifest -PsxPlay
          merged=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          if grep -q CallRecorderService "$merged"; then echo "Play build still declares CallRecorderService"; exit 1; fi
          echo "Play build: no accessibility call recorder ($merged)"
      - name: Build the on-phone tests for Sales Xray Dev
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest -PsxDev
      - name: Keep Sales Xray Dev
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/sales-xray-dev-android-0.3.${{ github.run_number }}-test.apk"
          # Run on a connected phone with adb (DeviceCaptureTest.java says how).
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "dist/sales-xray-dev-android-0.3.${{ github.run_number }}-device-tests.apk"
          sha256sum dist/*.apk
      - name: Keep the test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-android-${{ github.run_number }}-test
          path: apps/phone/dist/*.apk
          retention-days: 14
          if-no-files-found: error

  refuse-publish-off-main:
    if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Publish runs only on main
        run: |
          echo "::error::Publish runs only on main. Nothing was built or published."
          exit 1

  signed-build:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Install Capacitor
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load the durable signing key
        env:
          STORE_BASE64: ${{ secrets.SX_ANDROID_SIGNING_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SX_ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$STORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::The durable signing key isn't set on the android-release environment. Nothing was built or published."
            exit 1
          fi
          printf '%s' "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/sales-xray.keystore"
          echo "SX_SIGNING_STORE=$RUNNER_TEMP/sales-xray.keystore" >> "$GITHUB_ENV"
      - name: Sync the web shell into Android (live site)
        run: npx cap sync android
      - name: Build Sales Xray
        working-directory: apps/phone/android
        env:
          SX_BUILD_NUMBER: ${{ github.run_number }}
          SX_SIGNING_PASSWORD: ${{ secrets.SX_ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Keep Sales Xray, and drop the key
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/sales-xray-android-0.3.${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/sales-xray.keystore"
          sha256sum dist/*.apk
      - name: Keep the signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-android-${{ github.run_number }}
          path: apps/phone/dist/*.apk
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: signed-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sales-xray-android-${{ github.run_number }}
          path: dist
      - name: Update the published release in place
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sales-xray-android-latest
          VERSION: 0.3.${{ github.run_number }}
        run: |
          cp "sales-xray-android-$VERSION.apk" sales-xray-android.apk
          sha256sum sales-xray-android.apk > SHA256SUMS.txt
          title="Sales Xray for Android $VERSION"
          notes="Built from $GITHUB_SHA and signed with Authority Closers' key. Install help: https://salesxray.authorityclosers.com/apps"
          # A normal release marked latest (owner, 18 Oct): /releases/latest/download/sales-xray-android.apk
          # and the /apps page read it, so a publish must never turn it back into a pre-release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Replace the files in place so the download links never break, then move the tag to this build.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber sales-xray-android.apk SHA256SUMS.txt
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title "$title" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "$title" --notes "$notes" sales-xray-android.apk SHA256SUMS.txt
          fi
