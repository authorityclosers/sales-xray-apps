name: Google Play

# The Play Store build of Sales Xray (the play flavour: no call history, no accessibility call recorder, no all-files
# access, no battery-exemption request), as a signed App Bundle on a Play track.
#
# Run by hand on main only, in the protected "android-release" environment (the owner approves each
# run; owner, 23 Oct 2026: the app goes into Play internal testing). The upload key is the app's durable
# key (SX_ANDROID_SIGNING_*) unless a separate one is set; Play App Signing keeps the app signing key.
# Optional secrets in that environment (set from the owner's laptop; see apps/phone/PLAY-STORE.md):
#   SX_PLAY_UPLOAD_STORE_BASE64   a separate upload keystore (base64), never committed
#   SX_PLAY_UPLOAD_PASSWORD       its store and key password
#   SX_PLAY_UPLOAD_ALIAS          its key alias
#   SX_PLAY_SERVICE_ACCOUNT_JSON  the Play Console service account key (Release manager on this app);
#                                 without it the bundle stays in the run's artifacts to upload by hand
# Internal testing goes out to testers at once; other tracks stay drafts in Play Console.
#
# The release train (owner, 24 Oct 2026: "Can this not be automatyed trains and simpler shit"): when a
# Sales X-Ray release is live on production, the platform's ship script sends a repository_dispatch
# "sales-xray-prod-released" with the production commit and the release title; this workflow builds the
# Play bundle on that commit, checks it (Play gates, no microphone, the upload key) and puts it on internal
# testing, so testers' phones update from Play by themselves (apps/phone/PLAY-STORE.md, "Release train").
on:
  repository_dispatch:
    types: [sales-xray-prod-released]
  workflow_dispatch:
    inputs:
      web_ref:
        description: Platform repo ref whose web app goes inside the app (S9); production's commit for a release
        type: string
        default: main
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      notes:
        description: What's new (testers see it)
        type: string
        default: ""
      app_ref:
        description: Apps repo branch or commit to build (a release branch for a rebuild); the workflow itself runs from main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  play:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # android-release asks the owner to approve each run. For a train with no click, the owner makes an
    # environment without reviewers holding the same secrets and names it in this repo variable.
    environment: ${{ vars.PLAY_TRAIN_ENVIRONMENT || 'android-release' }}
    env:
      # From the dispatch (the production commit and the release title) or from the form.
      WEB_REF: ${{ inputs.web_ref || github.event.client_payload.sha || 'main' }}
      TRACK: ${{ inputs.track || 'internal' }}
      NOTES: ${{ inputs.notes || github.event.client_payload.title || '' }}
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A rebuild of an earlier release takes its own branch (e.g. release/1.0.25); otherwise main.
          ref: ${{ inputs.app_ref || github.sha }}
          persist-credentials: false
      - name: Which app is built
        run: echo "Apps repo $(git rev-parse HEAD) (${{ inputs.app_ref || 'main' }})"
      - name: A release from the train names its commit
        if: github.event_name == 'repository_dispatch'
        run: |
          [[ "$WEB_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The dispatch's client_payload.sha must be a full commit sha (got '$WEB_REF')"; exit 1; }
          echo "Play train: production $WEB_REF, track $TRACK"
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Capacitor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx cap sync android
      - name: The train's own tools, from this workflow's commit (a release-branch rebuild has older copies)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: train
          persist-credentials: false
          sparse-checkout: |
            apps/phone/play-gates.txt
            apps/phone/scripts/check-play-gates.py
            scripts/play-upload.py
          sparse-checkout-cone-mode: false
      - name: Check out the web app (platform repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: authorityclosers/authority-closers-platform
          ref: ${{ env.WEB_REF }}
          path: platform
          persist-credentials: false
      - name: The web copy is a production release with every Play gate (play-gates.txt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/train/apps/phone/scripts/check-play-gates.py" "$GITHUB_WORKSPACE/platform" "$GITHUB_WORKSPACE/train/apps/phone/play-gates.txt"
      - name: The web app inside the app (its static export, served from the phone; S9)
        run: bash scripts/build-web-shell.sh "$GITHUB_WORKSPACE/platform" android/app/src/main/assets/web salesxray.authorityclosers.com
      - name: Upload key
        env:
          STORE_BASE64: ${{ secrets.SX_PLAY_UPLOAD_STORE_BASE64 || secrets.SX_ANDROID_SIGNING_STORE_BASE64 }}
        run: |
          test -n "$STORE_BASE64" || { echo "No upload key in android-release (apps/phone/PLAY-STORE.md)"; exit 1; }
          echo "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Signed App Bundle (Play build)
        working-directory: apps/phone/android
        env:
          SX_SIGNING_STORE: ${{ runner.temp }}/upload.jks
          SX_SIGNING_PASSWORD: ${{ secrets.SX_PLAY_UPLOAD_PASSWORD || secrets.SX_ANDROID_SIGNING_PASSWORD }}
          SX_SIGNING_ALIAS: ${{ secrets.SX_PLAY_UPLOAD_ALIAS || 'sales-xray' }}
        run: |
          # Above every sideload build (1000 + Android run number). Expressions can't add, so the shell does.
          export SX_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          export SX_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          ./gradlew --no-daemon --stacktrace bundlePlayRelease
          # The bundle's merged manifest has no advertising ID (Play Console: "No advertising ID").
          manifest=$(find app/build/intermediates -path '*merged_manifest*playRelease*' -name AndroidManifest.xml | head -1)
          if grep -q 'android:name="com.google.android.gms.permission.AD_ID"' "$manifest"; then echo "::error::AD_ID declared ($manifest)"; exit 1; fi
          if grep -q 'android:name="android.permission.ACCESS_ADSERVICES_' "$manifest"; then echo "::error::AdServices ad permissions declared ($manifest)"; exit 1; fi
          if grep -q -e 'android:name="android.permission.FOREGROUND_SERVICE' -e 'foregroundServiceType=' "$manifest"; then echo "::error::A foreground service in the Play bundle ($manifest): Play wants a declaration for it"; exit 1; fi
          # No microphone in the first Play version (owner, 24 Oct 2026): no permission, no microphone service.
          if grep -q -e 'android:name="android.permission.RECORD_AUDIO"' -e 'android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"' -e 'foregroundServiceType="microphone"' "$manifest"; then echo "::error::The Play bundle still has the microphone ($manifest)"; exit 1; fi
          # The orchestrator's upload takes up to 10 MB; a bigger bundle is uploaded by the owner instead.
          size=$(stat -c %s app/build/outputs/bundle/playRelease/app-play-release.aab)
          echo "bundle: $size bytes"
          if [ "$size" -gt 10000000 ]; then echo "::warning::The bundle is $size bytes, over 10 MB: the owner uploads it in Play Console."; fi
      - name: Signed with the upload key Play knows
        working-directory: apps/phone/android
        env:
          # The durable key's certificate (public): CN=Sales Xray, O=Authority Closers.
          EXPECTED: ${{ vars.PLAY_UPLOAD_CERT_SHA256 || 'FF:1C:81:8F:67:B0:B3:2B:E9:46:E2:AA:D3:9D:90:E7:DA:51:BF:21:06:79:2E:22:06:8E:91:56:30:32:D8:CF' }}
        run: |
          bundle=app/build/outputs/bundle/playRelease/app-play-release.aab
          signed=$("$JAVA_HOME/bin/keytool" -printcert -jarfile "$bundle" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          [ "$signed" = "$EXPECTED" ] || { echo "::error::The bundle is signed with $signed, not the upload key $EXPECTED"; exit 1; }
          sum=$(sha256sum "$bundle" | cut -d' ' -f1)
          {
            echo "### Sales X-Ray for Google Play 1.0.${GITHUB_RUN_NUMBER}"
            echo "- versionCode $((100000 + GITHUB_RUN_NUMBER)), track $TRACK"
            echo "- web copy: platform $WEB_REF"
            echo "- bundle sha256 $sum"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "upload key OK; bundle sha256 $sum"
      - name: Keep the bundle (the very first release is uploaded by hand)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-play-${{ github.run_number }}
          path: apps/phone/android/app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 14
      - name: No call history, direct calling, accessibility recorder, all-files access or battery request in the bundle
        working-directory: apps/phone/android
        run: |
          # The final merged manifest; only declarations count (the source manifests' comments name them).
          manifest=$(find app/build/intermediates -path "*merged_manifests*playRelease*" -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          ! grep -E 'android:name="(android\.permission\.(READ_CALL_LOG|CALL_PHONE|MANAGE_EXTERNAL_STORAGE|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)|[a-z.]*CallRecorderService)"' "$manifest"
          echo "Play bundle declares none of them ($manifest)"
      - name: Upload to Play
        # The first release goes in by hand (Google needs one bundle before API uploads), and so does
        # every one until the service account is set.
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.SX_PLAY_SERVICE_ACCOUNT_JSON }}
          # The app's default listing language in Play Console (English, India).
          PLAY_NOTES_LANGUAGE: ${{ vars.PLAY_NOTES_LANGUAGE || 'en-IN' }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::No Play service account yet (secret PLAY_SERVICE_ACCOUNT_JSON): download the sales-xray-play-${{ github.run_number }} artifact and upload it in Play Console."
            exit 0
          fi
          pip install --quiet google-api-python-client==2.151.0 google-auth==2.35.0
          python "$GITHUB_WORKSPACE/train/scripts/play-upload.py" android/app/build/outputs/bundle/playRelease/app-play-release.aab "$TRACK" "$NOTES"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
