name: Google Play

# The Play Store build of Sales Xray (the play flavour: no call history, no accessibility call recorder, no all-files
# access, no battery-exemption request), as a signed App Bundle on a Play track.
#
# Run by hand on main only, in the protected "android-release" environment (the owner approves each
# run; owner, 23 Oct 2026: the app goes into Play internal testing). The upload key is the app's durable
# key (SX_ANDROID_SIGNING_*) unless a separate one is set; Play App Signing keeps the app signing key.
# Optional secrets in that environment (set from the owner's laptop; see apps/phone/PLAY-STORE.md):
#   SX_PLAY_UPLOAD_STORE_BASE64   a separate upload keystore (base64), never committed
#   SX_PLAY_UPLOAD_PASSWORD       its store and key password
#   SX_PLAY_UPLOAD_ALIAS          its key alias
#   SX_PLAY_SERVICE_ACCOUNT_JSON  the Play Console service account key (Release manager on this app);
#                                 without it the bundle stays in the run's artifacts to upload by hand
# Internal testing goes out to testers at once; other tracks stay drafts in Play Console.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      notes:
        description: What's new (testers see it)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  play:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Capacitor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx cap sync android
      - name: Upload key
        env:
          STORE_BASE64: ${{ secrets.SX_PLAY_UPLOAD_STORE_BASE64 || secrets.SX_ANDROID_SIGNING_STORE_BASE64 }}
        run: |
          test -n "$STORE_BASE64" || { echo "No upload key in android-release (apps/phone/PLAY-STORE.md)"; exit 1; }
          echo "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Signed App Bundle (Play build)
        working-directory: apps/phone/android
        env:
          SX_SIGNING_STORE: ${{ runner.temp }}/upload.jks
          SX_SIGNING_PASSWORD: ${{ secrets.SX_PLAY_UPLOAD_PASSWORD || secrets.SX_ANDROID_SIGNING_PASSWORD }}
          SX_SIGNING_ALIAS: ${{ secrets.SX_PLAY_UPLOAD_ALIAS || 'sales-xray' }}
        run: |
          # Above every sideload build (1000 + Android run number). Expressions can't add, so the shell does.
          export SX_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          export SX_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          ./gradlew --no-daemon --stacktrace bundlePlayRelease
      - name: Keep the bundle (the very first release is uploaded by hand)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-xray-play-${{ github.run_number }}
          path: apps/phone/android/app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 14
      - name: No call history, direct calling, accessibility recorder, all-files access or battery request in the bundle
        working-directory: apps/phone/android
        run: |
          # The final merged manifest; only declarations count (the source manifests' comments name them).
          manifest=$(find app/build/intermediates -path "*merged_manifests*playRelease*" -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          ! grep -E 'android:name="(android\.permission\.(READ_CALL_LOG|CALL_PHONE|MANAGE_EXTERNAL_STORAGE|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)|[a-z.]*CallRecorderService)"' "$manifest"
          echo "Play bundle declares none of them ($manifest)"
      - name: Upload to Play
        # The first release goes in by hand (Google needs one bundle before API uploads), and so does
        # every one until the service account is set.
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.SX_PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No Play service account yet: download the sales-xray-play-${{ github.run_number }} artifact and upload it in Play Console."
            exit 0
          fi
          pip install --quiet google-api-python-client==2.151.0 google-auth==2.35.0
          python ../../scripts/play-upload.py android/app/build/outputs/bundle/playRelease/app-play-release.aab "$TRACK" "$NOTES"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
