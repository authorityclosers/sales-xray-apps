name: No secrets

# This repo is public. Every push and pull request fails if it adds a key,
# keystore, certificate, .env file or a secret-looking string. Signing keys
# live only in GitHub secrets (set from the owner's laptop) and Infisical.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the scanner
        run: node --test scripts/*.test.mjs
      - name: Scan every tracked file
        run: node scripts/check-no-secrets.mjs
