[package]
name = "sales-xray-desktop"
version = "0.1.0"
description = "Sales Xray for Mac and Windows"
authors = ["Authority Closers"]
license = "LicenseRef-AllRightsReserved"
publish = false
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
