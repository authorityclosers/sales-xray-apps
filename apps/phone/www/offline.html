<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sales X-Ray</title>
    <style>
      :root {
        color-scheme: light dark;
        --ground: #f2f3f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --mark: #07746b;
        --on-mark: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #000000;
          --card: #1c1c1e;
          --ink: #f5f5f7;
          --muted: #a1a1a6;
          --mark: #2dd4bf;
          --on-mark: #04221d;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--ground);
        color: var(--ink);
        font:
          16.5px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      main {
        background: var(--card);
        border-radius: 22px;
        padding: 28px 24px 24px;
        max-width: 340px;
        width: 100%;
        box-sizing: border-box;
      }
      svg {
        width: 56px;
        height: 56px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--mark);
        color: var(--on-mark);
        font: 600 16px/1 inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="20 20 68 68" aria-hidden="true">
        <g fill="currentColor" style="color: var(--mark)">
          <rect x="26.5" y="44" width="7" height="20" rx="3.5" />
          <rect x="38.5" y="32" width="7" height="44" rx="3.5" />
          <rect x="50.5" y="24" width="7" height="60" rx="3.5" />
          <rect x="62.5" y="36" width="7" height="36" rx="3.5" />
          <rect x="74.5" y="30" width="7" height="48" rx="3.5" />
        </g>
      </svg>
      <h1>Sales X-Ray can't be reached</h1>
      <p>
        Check your internet connection. Sales X-Ray opens again by itself when
        it's back. Your call recordings stay on this phone.
      </p>
      <button type="button" onclick="retry()">Try again</button>
    </main>
    <script>
      function retry() {
        location.replace("https://salesxray.authorityclosers.com/");
      }
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
