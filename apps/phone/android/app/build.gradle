apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace = "com.authorityclosers.salesxray"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.authorityclosers.salesxray"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the run number so each build installs over the last. Builds
        // from this repo are 0.3.x with codes from 1001, above every 0.2.x build
        // the main repo made before the apps moved here.
        versionCode(1000 + (System.getenv("SX_BUILD_NUMBER") ?: "1").toInteger())
        versionName "0.3.${System.getenv("SX_BUILD_NUMBER") ?: "0"}"
        // Play builds (play.yml) number themselves above every sideload build.
        if (System.getenv("SX_VERSION_CODE")) versionCode(System.getenv("SX_VERSION_CODE").toInteger())
        if (System.getenv("SX_VERSION_NAME")) versionName System.getenv("SX_VERSION_NAME")
        manifestPlaceholders = [appIcon: "@mipmap/ic_launcher", appRoundIcon: "@mipmap/ic_launcher_round", appLabel: "Sales X-Ray"]
        // The call recorder listens to this app's own events only (call_recorder_service.xml).
        resValue "string", "sx_self_package", "com.authorityclosers.salesxray"
        // -PsxDev builds "Sales Xray Dev": dev's site, installed beside the real app.
        if (project.hasProperty("sxDev")) {
            applicationIdSuffix = ".devnext"
            versionNameSuffix = "-dev"
            manifestPlaceholders = [appIcon: "@mipmap/ic_launcher", appRoundIcon: "@mipmap/ic_launcher_round", appLabel: "Sales X-Ray Dev"]
            resValue "string", "sx_self_package", "com.authorityclosers.salesxray.devnext"
        }
        // Which store this build is for (the page and the setup checklist read it).
        resValue "string", "sx_store", "direct"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two builds of one app (owner, 23 Oct 2026): "direct" is the download-link app with
    // everything; "play" is the Google Play app, whose manifest (src/play) leaves out what Play
    // allows only for other kinds of app. The code checks what its build declares, so a
    // feature the Play build lacks is simply not offered.
    flavorDimensions = ["store"]
    productFlavors {
        direct {
            dimension "store"
        }
        staging {
            dimension "store"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            manifestPlaceholders = [appIcon: "@drawable/staging_icon", appRoundIcon: "@drawable/staging_icon", appLabel: "Sales X-Ray Staging"]
            resValue "string", "sx_self_package", "com.authorityclosers.salesxray.staging"
            resValue "string", "sx_store", "play"
        }
        play {
            dimension "store"
            resValue "string", "sx_store", "play"
        }
    }
    // Staging uses the Play permission/service overlay, never a fork of native code.
    sourceSets {
        staging {
            manifest.srcFile 'src/play/AndroidManifest.xml'
            java.srcDir 'src/play/java'
        }
    }
    signingConfigs {
        // No key lives in this public repo. Debug builds are signed with the
        // runner's throwaway debug key: fine for a test install, never
        // published, and they won't install over another build.
        // The durable key: CI writes it from GitHub secrets that only the
        // owner's laptop sets, and only for a publish run. It signs release
        // builds only, so a published APK is never debuggable.
        if (System.getenv("SX_SIGNING_STORE")) {
            durable {
                storeFile file(System.getenv("SX_SIGNING_STORE"))
                storePassword System.getenv("SX_SIGNING_PASSWORD")
                keyAlias System.getenv("SX_SIGNING_ALIAS") ?: "sales-xray"
                keyPassword System.getenv("SX_SIGNING_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv("SX_SIGNING_STORE")) {
                signingConfig signingConfigs.durable
            }
            minifyEnabled false
            // Nothing is shrunk, so there is no mapping file to send.
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.work:work-runtime:2.10.0"
    // Google sign-in opens in a Chrome Custom Tab: Google refuses web views.
    implementation "androidx.browser:browser:1.8.0"
    // Sign-in inside the app (owner, 23 Oct 2026; NativeSignIn.java): Android's own Google
    // account sheet through Credential Manager, and the Facebook SDK (the Facebook app, or
    // Facebook's own sheet over this app). The Custom Tab above stays for Apple and older pages.
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "com.facebook.android:facebook-login:18.3.0"
    // Lead alerts. Firebase starts with settings Sales Xray sends at run time
    // (LeadAlerts.java), so no google-services.json is needed or kept here.
    implementation "com.google.firebase:firebase-messaging:24.1.2"
    // Crash reports (S6, owner 23 Oct 2026) through the same Firebase project; the pair
    // Firebase's own bill of materials 33.16.0 ships together.
    implementation "com.google.firebase:firebase-crashlytics:19.4.4"
    // Google Play in-app updates, in the Play build only (src/play/StoreUpdates.java).
    playImplementation "com.google.android.play:app-update:2.1.0"
    stagingImplementation "com.google.android.play:app-update:2.1.0"
    // Google Play In-App Review, Play build only (src/play/StoreReview.java).
    playImplementation "com.google.android.play:review:2.0.2"
    stagingImplementation "com.google.android.play:review:2.0.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Plain-JVM tests read and write JSON (Android's own org.json is only a stub there).
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.work:work-testing:2.10.0"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
