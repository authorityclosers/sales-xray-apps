apply plugin: 'com.android.application'

android {
    namespace = "com.authorityclosers.salesxray"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.authorityclosers.salesxray"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the run number so each build installs over the last. Builds
        // from this repo are 0.3.x with codes from 1001, above every 0.2.x build
        // the main repo made before the apps moved here.
        versionCode(1000 + (System.getenv("SX_BUILD_NUMBER") ?: "1").toInteger())
        versionName "0.3.${System.getenv("SX_BUILD_NUMBER") ?: "0"}"
        // Play builds (play.yml) number themselves above every sideload build.
        if (System.getenv("SX_VERSION_CODE")) versionCode(System.getenv("SX_VERSION_CODE").toInteger())
        if (System.getenv("SX_VERSION_NAME")) versionName System.getenv("SX_VERSION_NAME")
        manifestPlaceholders = [appLabel: "Sales Xray"]
        // The call recorder listens to this app's own events only (call_recorder_service.xml).
        resValue "string", "sx_self_package", "com.authorityclosers.salesxray"
        // -PsxDev builds "Sales Xray Dev": dev's site, installed beside the real app.
        if (project.hasProperty("sxDev")) {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            manifestPlaceholders = [appLabel: "Sales Xray Dev"]
            resValue "string", "sx_self_package", "com.authorityclosers.salesxray.dev"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // No key lives in this public repo. Debug builds are signed with the
        // runner's throwaway debug key: fine for a test install, never
        // published, and they won't install over another build.
        // The durable key: CI writes it from GitHub secrets that only the
        // owner's laptop sets, and only for a publish run. It signs release
        // builds only, so a published APK is never debuggable.
        if (System.getenv("SX_SIGNING_STORE")) {
            durable {
                storeFile file(System.getenv("SX_SIGNING_STORE"))
                storePassword System.getenv("SX_SIGNING_PASSWORD")
                keyAlias System.getenv("SX_SIGNING_ALIAS") ?: "sales-xray"
                keyPassword System.getenv("SX_SIGNING_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv("SX_SIGNING_STORE")) {
                signingConfig signingConfigs.durable
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// -PsxPlay: a Play Store build without the accessibility call recorder (CEO 19 Oct: sideload
// builds only). Its manifest overlay removes the service; the app then reports it unavailable.
if (project.hasProperty("sxPlay")) {
    android.sourceSets.debug.manifest.srcFile "src/play/AndroidManifest.xml"
    android.sourceSets.release.manifest.srcFile "src/play/AndroidManifest.xml"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.work:work-runtime:2.10.0"
    // Google sign-in opens in a Chrome Custom Tab: Google refuses web views.
    implementation "androidx.browser:browser:1.8.0"
    // Lead alerts. Firebase starts with settings Sales Xray sends at run time
    // (LeadAlerts.java), so no google-services.json is needed or kept here.
    implementation "com.google.firebase:firebase-messaging:24.1.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Plain-JVM tests read and write JSON (Android's own org.json is only a stub there).
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
